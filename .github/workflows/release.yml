name: Release Pipeline

# 执行 scripts/build-and-push.sh <版本号>（自动调用 gh workflow run --ref <tag>）时触发：
#   1) 常规检查（gofmt / go vet / 单元测试 / 竞态检测 / 编译 / FFmpeg 自检）
#   2) Go 自包含二进制（linux/amd64 + arm64，内嵌前端），生成 sha256 并创建 GitHub Release
#   3) 构建并推送 multi-arch Docker 镜像（Docker Hub + GHCR）
#   4) 同步 Git 仓库与标签到 CNB 镜像仓库
# 一次发版只产生一条 workflow run（jobs 链式：test -> build-binaries -> publish-release -> build-docker -> sync-cnb）。
# 日常 push / PR 由 ci.yml 负责；打 tag 不再触发任何工作流。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的标签 (例如: v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref_name || github.event.inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name || github.event.inputs.tag }}
  GO_VERSION: '1.25'
  DOCKERHUB_IMAGE: mobufan/fan-image-tr
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  # 固定版本静态 FFmpeg：与 runner 镜像解耦，ubuntu-latest 迁移或 apt 仓库变动均不影响自检结果
  # 来源 BtbN/FFmpeg-Builds（GitHub 托管），sha256 已与 GitHub API digest 交叉校验
  # 注意：BtbN 仅保留约两周的 autobuild，固定标签会过期（404）；升级时同步更新五项
  FFMPEG_BUILD: 'autobuild-2026-10-19-13-06'
  FFMPEG_ASSET: 'ffmpeg-n8.1.3-18-g46d899d7a0-linux64-gpl-8.1.tar.xz'
  FFMPEG_DIR: 'ffmpeg-n8.1.3-18-g46d899d7a0-linux64-gpl-8.1'
  FFMPEG_SHA256: 'cc546852e535193e6d30a1f18cb90daa84e8ff320ceac6c6f5b514a1fba67079'

jobs:
  test:
    name: 常规检查 (gofmt / vet / 测试 / FFmpeg 自检)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ format('refs/tags/{0}', github.event.inputs.tag) }}

      - name: Validate tag format
        run: |
          if [[ ! "${{ github.event.inputs.tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "错误: 标签格式无效，必须形如 vX.Y.Z，例如: v1.0.0"
            exit 1
          fi
          VER="$(sed -n 's/^var Version = "\([0-9.]*\)"/\1/p' internal/version/version.go | head -1)"
          if [ "${VER}" != "${{ github.event.inputs.tag }}" ] && [ "v${VER}" != "${{ github.event.inputs.tag }}" ]; then
            echo "错误: internal/version/version.go 中的 Version=${VER} 与本次 tag ${{ github.event.inputs.tag }} 不一致"
            echo "请先执行 scripts/build-and-push.sh 更新版本后发布"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 安装 FFmpeg（固定版本静态构建）
        run: |
          set -euo pipefail
          url="https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_BUILD}/${FFMPEG_ASSET}"
          dest="$RUNNER_TEMP/${FFMPEG_ASSET}"
          curl -fsSL --retry 3 --retry-delay 5 -o "$dest" "$url"
          echo "${FFMPEG_SHA256}  ${dest}" | sha256sum -c -
          tar -xJf "$dest" -C "$RUNNER_TEMP"
          echo "${RUNNER_TEMP}/${FFMPEG_DIR}/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/${FFMPEG_DIR}/bin/ffmpeg" -version | head -1
          "${RUNNER_TEMP}/${FFMPEG_DIR}/bin/ffprobe" -version | head -1

      - name: gofmt 检查
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 单元测试
        run: go test -timeout 300s ./...

      - name: 竞态检测
        run: go test -race -timeout 600s ./...

      - name: 编译
        run: go build -trimpath -o /tmp/fan-image-tr .

      - name: FFmpeg 能力自检
        run: /tmp/fan-image-tr check

      - name: CLI 冒烟（help/version/uninstall -h）
        run: |
          /tmp/fan-image-tr version
          /tmp/fan-image-tr help >/dev/null
          /tmp/fan-image-tr uninstall -h >/dev/null

  build-binaries:
    name: 编译二进制 (linux amd64 + arm64，内嵌前端)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ format('refs/tags/{0}', github.event.inputs.tag) }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build amd64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -X github.com/meimolihan/fan-image-tr/internal/version.Version=${RELEASE_TAG#v} -X github.com/meimolihan/fan-image-tr/internal/version.Commit=${GITHUB_SHA::7} -X github.com/meimolihan/fan-image-tr/internal/version.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o fan-image-tr_linux_amd64 .

      - name: Build arm64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath \
            -ldflags="-s -w -X github.com/meimolihan/fan-image-tr/internal/version.Version=${RELEASE_TAG#v} -X github.com/meimolihan/fan-image-tr/internal/version.Commit=${GITHUB_SHA::7} -X github.com/meimolihan/fan-image-tr/internal/version.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o fan-image-tr_linux_arm64 .

      - name: Verify build outputs
        id: build
        run: |
          set -e
          ls -lh fan-image-tr_linux_amd64 fan-image-tr_linux_arm64
          sha256sum fan-image-tr_linux_amd64 fan-image-tr_linux_arm64 > sha256sums.txt
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Upload binaries as artifacts
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: fan-image-tr-binaries
          path: |
            fan-image-tr_linux_amd64
            fan-image-tr_linux_arm64
            sha256sums.txt
          if-no-files-found: error

  publish-release:
    name: 发布 Release (附二进制 + sha256)
    needs: build-binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ format('refs/tags/{0}', github.event.inputs.tag) }}

      - name: Download binaries
        if: needs.build-binaries.outputs.built == 'true'
        uses: actions/download-artifact@v8
        with:
          name: fan-image-tr-binaries
          path: ./

      - name: Prepare release body
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            cp RELEASE_NOTES.md _release_body.md
          else
            {
              echo "fan-image-tr ${{ env.RELEASE_TAG }}"
              echo ""
              echo "Docker 镜像："
              echo "  - Docker Hub：docker pull ${{ env.DOCKERHUB_IMAGE }}:${{ env.RELEASE_TAG }}"
              echo "  - GHCR：docker pull ${{ env.GHCR_IMAGE }}:${{ env.RELEASE_TAG }}"
            } > _release_body.md
          fi

      - name: Create / update Release with binaries
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          FILES=""
          [ -f sha256sums.txt ] && FILES="$FILES sha256sums.txt"
          [ -f fan-image-tr_linux_amd64 ] && FILES="$FILES fan-image-tr_linux_amd64"
          [ -f fan-image-tr_linux_arm64 ] && FILES="$FILES fan-image-tr_linux_arm64"
          gh release create "$TAG" \
            --title "fan-image-tr $TAG" \
            --notes-file _release_body.md \
            $FILES
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docker:
    name: 构建推送 Docker 镜像 (Docker Hub + GHCR)
    needs: publish-release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ format('refs/tags/{0}', github.event.inputs.tag) }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          VER="${{ env.RELEASE_TAG }}"
          VER_NO_V="${VER#v}"
          TAGS="${{ env.DOCKERHUB_IMAGE }}:${VER},${{ env.DOCKERHUB_IMAGE }}:${VER_NO_V},${{ env.DOCKERHUB_IMAGE }}:latest"
          TAGS="${TAGS},${{ env.GHCR_IMAGE }}:${VER},${{ env.GHCR_IMAGE }}:${VER_NO_V},${{ env.GHCR_IMAGE }}:latest"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "ver_no_v=${VER_NO_V}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.tags.outputs.ver_no_v }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sync-cnb:
    name: 同步到 CNB 镜像仓库
    needs: build-docker
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # CNB 同步为 best-effort：失败不阻塞 Release（二进制 + Docker 已发布完成）
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ format('refs/tags/{0}', github.event.inputs.tag) }}

      - name: Ensure CNB repository exists
        if: ${{ env.CNB_TOKEN != '' }}
        env:
          CNB_TOKEN: ${{ secrets.CNB_ACCESS_TOKEN }}
        run: |
          # 幂等：CNB 目标仓库不存在时先通过 OpenAPI 创建，存在/无权限则交由 git-sync 校验
          HTTP_CODE=$(curl -s -o /tmp/cnb_repo.json -w '%{http_code}' \
            -X POST "https://api.cnb.cool/meimolihan/-/repos" \
            -H "Authorization: Bearer ${CNB_TOKEN}" \
            -H "Accept: application/vnd.cnb.api+json" \
            -H "Content-Type: application/json" \
            -d '{"name":"fan-image-tr","description":"fan-image-tr 图片处理工具（与 GitHub 仓库 main + 全部 tag 同步）","visibility":"public"}')
          echo "Create CNB repo status: ${HTTP_CODE}"
          if [ "${HTTP_CODE}" != "201" ]; then
            echo "非 201（可能已存在），内容如下，继续由同步步骤校验："
            cat /tmp/cnb_repo.json || true
          fi

      - name: Sync to CNB Repository
        if: ${{ env.CNB_TOKEN != '' }}
        env:
          CNB_TOKEN: ${{ secrets.CNB_ACCESS_TOKEN }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:${{ github.workspace }} \
            -w ${{ github.workspace }} \
            -e PLUGIN_TARGET_URL="https://cnb.cool/meimolihan/fan-image-tr.git" \
            -e PLUGIN_AUTH_TYPE="https" \
            -e PLUGIN_USERNAME="cnb" \
            -e PLUGIN_PASSWORD="$CNB_TOKEN" \
            -e PLUGIN_FORCE="true" \
            -e PLUGIN_PUSH_TAGS="true" \
            tencentcom/git-sync

      - name: Skip CNB sync
        if: ${{ env.CNB_TOKEN == '' }}
        env:
          CNB_TOKEN: ${{ secrets.CNB_ACCESS_TOKEN }}
        run: echo "::warning::CNB_ACCESS_TOKEN 未配置，跳过同步到 CNB 镜像仓库"
