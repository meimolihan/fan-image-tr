name: CI

on:
  # 仅推送 tag 时触发（由 scripts/build-and-push.sh 负责打 tag）；
  # 日常 push 到 main / PR 不再触发工作流
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.25'
  # 固定版本静态 FFmpeg：与 runner 镜像解耦，ubuntu-latest 迁移或 apt 仓库变动均不影响自检结果
  # 来源 BtbN/FFmpeg-Builds（GitHub 托管），sha256 已与 GitHub API digest 交叉校验
  # 注意：BtbN 仅保留约两周的 autobuild，固定标签会过期（404）；升级时同步更新五项
  FFMPEG_BUILD: 'autobuild-2026-10-19-13-06'
  FFMPEG_ASSET: 'ffmpeg-n8.1.3-18-g46d899d7a0-linux64-gpl-8.1.tar.xz'
  FFMPEG_DIR: 'ffmpeg-n8.1.3-18-g46d899d7a0-linux64-gpl-8.1'
  FFMPEG_SHA256: 'cc546852e535193e6d30a1f18cb90daa84e8ff320ceac6c6f5b514a1fba67079'
  # 镜像仓库目标
  DOCKERHUB_IMAGE: mobufan/fan-image-tr
  GHCR_IMAGE: ghcr.io/meimolihan/fan-image-tr

jobs:
  test:
    name: 单元测试与静态检查
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 安装 FFmpeg（固定版本静态构建）
        run: |
          set -euo pipefail
          url="https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_BUILD}/${FFMPEG_ASSET}"
          dest="$RUNNER_TEMP/${FFMPEG_ASSET}"
          curl -fsSL --retry 3 --retry-delay 5 -o "$dest" "$url"
          echo "${FFMPEG_SHA256}  ${dest}" | sha256sum -c -
          tar -xJf "$dest" -C "$RUNNER_TEMP"
          echo "${RUNNER_TEMP}/${FFMPEG_DIR}/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/${FFMPEG_DIR}/bin/ffmpeg" -version | head -1
          "${RUNNER_TEMP}/${FFMPEG_DIR}/bin/ffprobe" -version | head -1

      - name: gofmt 检查
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 单元测试
        run: go test -timeout 300s ./...

      - name: 竞态检测
        run: go test -race -timeout 600s ./...

      - name: 编译
        run: go build -trimpath -o /tmp/fan-image-tr .

      - name: FFmpeg 能力自检
        run: /tmp/fan-image-tr check

  docker:
    name: 镜像构建
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: 构建镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: fan-image-tr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冒烟测试
        run: |
          docker run -d --name fit -p 8791:8791 fan-image-tr:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8791/api/health >/dev/null; then
              echo "健康检查通过"
              curl -fsS http://127.0.0.1:8791/api/health
              docker exec fit /usr/local/bin/fan-image-tr check | head -30
              docker rm -f fit
              exit 0
            fi
            sleep 1
          done
          echo "服务启动超时"
          docker logs fit
          docker rm -f fit
          exit 1

  # 推送镜像到 Docker Hub 与 GHCR：仅在打 tag 时执行，避免 main 分支提交覆盖 latest
  publish:
    name: 推送镜像
    runs-on: ubuntu-24.04
    needs: [test, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          TAG="${GITHUB_REF_NAME}"          # 例如 v0.0.5
          VER="${TAG#v}"                    # 例如 0.0.5
          TAGS="${DOCKERHUB_IMAGE}:${TAG},${DOCKERHUB_IMAGE}:${VER},${DOCKERHUB_IMAGE}:latest"
          TAGS="${TAGS},${GHCR_IMAGE}:${TAG},${GHCR_IMAGE}:${VER},${GHCR_IMAGE}:latest"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: 发布
    runs-on: ubuntu-24.04
    needs: [test, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 交叉编译
        run: |
          mkdir -p dist
          version=${GITHUB_REF_NAME#v}
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            [ "$os" = "windows" ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/meimolihan/fan-image-tr/internal/version.Version=$version" \
              -o dist/fan-image-tr-$os-$arch$ext .
          done
          tar -czf dist/fan-image-tr-src.tar.gz --exclude=dist .

      - name: 上传产物
        uses: softprops/action-gh-release@v3
        with:
          # 发版说明：由 scripts/build-and-push.sh 生成并随代码一起提交
          body_path: RELEASE_NOTES.md
          files: |
            dist/fan-image-tr-*
            dist/fan-image-tr-src.tar.gz
