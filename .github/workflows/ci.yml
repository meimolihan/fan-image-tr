name: CI

on:
  # 仅推送 tag 时触发（由 scripts/build-and-push.sh 负责打 tag）；
  # 日常 push 到 main / PR 不再触发工作流。
  # 本工作流负责常规检查（测试 + 镜像冒烟），发布由 release.yml 承担。
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.25'
  # 固定版本静态 FFmpeg：与 runner 镜像解耦，ubuntu-latest 迁移或 apt 仓库变动均不影响自检结果
  # 来源 BtbN/FFmpeg-Builds（GitHub 托管），sha256 已与 GitHub API digest 交叉校验
  # 注意：BtbN 仅保留约两周的 autobuild，固定标签会过期（404）；升级时同步更新五项
  FFMPEG_BUILD: 'autobuild-2026-10-19-13-06'
  FFMPEG_ASSET: 'ffmpeg-n8.1.3-18-g46d899d7a0-linux64-gpl-8.1.tar.xz'
  FFMPEG_DIR: 'ffmpeg-n8.1.3-18-g46d899d7a0-linux64-gpl-8.1'
  FFMPEG_SHA256: 'cc546852e535193e6d30a1f18cb90daa84e8ff320ceac6c6f5b514a1fba67079'

jobs:
  test:
    name: 单元测试与静态检查
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 安装 FFmpeg（固定版本静态构建）
        run: |
          set -euo pipefail
          url="https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_BUILD}/${FFMPEG_ASSET}"
          dest="$RUNNER_TEMP/${FFMPEG_ASSET}"
          curl -fsSL --retry 3 --retry-delay 5 -o "$dest" "$url"
          echo "${FFMPEG_SHA256}  ${dest}" | sha256sum -c -
          tar -xJf "$dest" -C "$RUNNER_TEMP"
          echo "${RUNNER_TEMP}/${FFMPEG_DIR}/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/${FFMPEG_DIR}/bin/ffmpeg" -version | head -1
          "${RUNNER_TEMP}/${FFMPEG_DIR}/bin/ffprobe" -version | head -1

      - name: gofmt 检查
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 单元测试
        run: go test -timeout 300s ./...

      - name: 竞态检测
        run: go test -race -timeout 600s ./...

      - name: 编译
        run: go build -trimpath -o /tmp/fan-image-tr .

      - name: FFmpeg 能力自检
        run: /tmp/fan-image-tr check

      - name: CLI 冒烟（help/version/uninstall -h）
        run: |
          /tmp/fan-image-tr version
          /tmp/fan-image-tr help >/dev/null
          /tmp/fan-image-tr uninstall -h >/dev/null

  docker:
    name: 镜像构建
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: 构建镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: fan-image-tr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冒烟测试
        run: |
          docker run -d --name fit -p 8791:8791 fan-image-tr:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8791/api/health >/dev/null; then
              echo "健康检查通过"
              curl -fsS http://127.0.0.1:8791/api/health
              docker exec fit /usr/local/bin/fan-image-tr check | head -30
              docker rm -f fit
              exit 0
            fi
            sleep 1
          done
          echo "服务启动超时"
          docker logs fit
          docker rm -f fit
          exit 1
